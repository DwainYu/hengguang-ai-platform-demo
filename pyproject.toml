[project]
name = "hengguang-ai-platform-demo"
version = "0.1.0"
description = "Job-hunt technical demo: a minimal enterprise AI platform (Model Gateway, RAG, Agent, RBAC, Audit) for a chemical manufacturing company. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
python-preference = "managed"
