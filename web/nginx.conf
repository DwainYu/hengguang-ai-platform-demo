# Static console bundle + same-origin proxy to the API container.
#
# `proxy_pass` uses a variable plus Docker's embedded resolver on purpose: nginx
# then resolves `api` per request instead of at start-up, so the web container can
# never crash with "host not found in upstream" while the API is still booting or
# is restarting.
server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # The console talks to exactly three surfaces; all of them stay same-origin.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }
}
