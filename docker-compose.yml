# One-command deployment of the demo platform: API (FastAPI + RAG + Agent) and the
# web console (static bundle served by nginx, which proxies /api, /health and
# /metrics to the API container so the browser stays same-origin — no CORS).
#
# `.env` is optional: every setting has a mock-friendly default in app/config.py,
# so a clean clone runs with plain `docker compose up --build`.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      # SQLite + Chroma live here, so restarts keep the seeded business data and
      # the ingested knowledge base.
      - ./data/runtime:/app/data/runtime
      - ./data/documents:/app/data/documents:ro
      - ./data/synthetic:/app/data/synthetic:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
